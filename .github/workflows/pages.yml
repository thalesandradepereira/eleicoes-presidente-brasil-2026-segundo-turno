name: QA and Publish Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify embedded TSE dataset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python environment
        run: python3 --version
      - name: Unit and integrity tests
        run: python3 -m unittest discover -s tests -v
      - name: Check publication entrypoint
        shell: bash
        run: |
          test -s index.html
          test -s README.md
          test -f .nojekyll
          echo "QA PASS: index.html and static assets exist"

  deploy:
    name: Deploy GitHub Pages (only when eligible)
    needs: verify
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare isolated site artifact
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
